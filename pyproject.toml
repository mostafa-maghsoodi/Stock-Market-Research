[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graham-systematic-research"
version = "0.2.3"
description = "Point-in-time, explainable stock-selection research framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
]

[project.optional-dependencies]
live = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
graham-research = "graham_research.cli:main"
graham-live = "graham_research.live:serve"

[tool.setuptools.packages.find]
where = ["src"]
